<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ron — UI/UX Designer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500&family=Google+Sans+Display:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #222222;
    --rust: #C8704A;
    --mid: #555555;
    --off-white: #F7F8FA;7
    --lt: #E8EDF3;
    --border: #EAECF0;
    --font-sans: 'Google Sans', sans-serif;
    --font-display: 'Google Sans Display', sans-serif;
  }

  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html {
    font-size: 16px;
  }

  body {
    font-family: var(--font-sans);
    background-color: var(--off-white);
    color: var(--navy);
    -webkit-font-smoothing: antialiased;
  }

  /* ── NAV ── */
  nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 24px 40px;
  }

  .nav-logo {
    font-family: var(--font-display);
    font-size: 15px;
    font-weight: 500;
    color: var(--navy);
    text-decoration: none;
    letter-spacing: -0.01em;
  }

  .nav-links {
    display: flex;
    gap: 32px;
    list-style: none;
  }

  .nav-links a {
    font-size: 14px;
    font-weight: 400;
    color: var(--mid);
    text-decoration: none;
    transition: color 0.15s;
  }

  .nav-links a:hover {
    color: var(--navy);
  }
</style>
</head>
<body>

<nav>
  <a href="#" class="nav-logo">Ron Kim</a>
  <ul class="nav-links">
    <li><a href="#work">Work</a></li>
    <li><a href="#about">About Me</a></li>
    <li><a href="#">Resume</a></li>
  </ul>
</nav>
</body>
</html>
